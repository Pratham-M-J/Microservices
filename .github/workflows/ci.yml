name: Go CI

on:
  push:
    branches:
      - main
      - master
      - test

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download Dependencies
        run: go mod download

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...